# Host Nginx reverse proxy for Lor Mentor.
#
# Install:  sudo cp deploy/nginx/lor-mentor.conf /etc/nginx/sites-available/lor-mentor
#           sudo ln -s /etc/nginx/sites-available/lor-mentor /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#
# Then provision TLS (this edits the file to add the :443 blocks + redirects):
#           sudo certbot --nginx -d lormentor.com -d www.lormentor.com -d api.lormentor.com
#
# Replace lormentor.com with your real domain before running.

# ── Frontend (Next.js on 127.0.0.1:3000) ────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name lormentor.com www.lormentor.com;

    # Materials uploads are capped by Multer at 25 MB; leave headroom for
    # multipart framing so nginx does not reject a valid upload first.
    client_max_body_size 30m;

    # Baseline security headers (helmet also sets these on API responses).
    # No CSP here: the Next.js app and its inline bootstrap scripts would need
    # a nonce/hash policy first, so CSP is deliberately out of scope.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Enable HSTS only after HTTPS is verified end-to-end (certbot installed,
    # https:// and http:// redirect both tested). Keep this commented until then.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml model/gltf-binary;
    gzip_min_length 1024;

    # Anatomy Lab models are immutable once published: the filename carries
    # the version (<name>.vN.glb) and the validator pins every shipped hash in
    # published-models.json. Only this exact filename shape gets a year-long
    # cache; manifests, thumbnails, and unversioned files keep normal caching.
    location ~ ^/models/anatomy/[^/]+\.v[0-9]+\.glb$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Replace any upstream cache policy with the immutable one. No `always`:
        # a 404 for a mistyped model must not be cached for a year.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # add_header in a location replaces inherited headers, so repeat the
        # baseline security headers here.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ── API (NestJS on 127.0.0.1:4000) ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.lormentor.com;

    # Receipt images are capped at 10 MB and materials at 25 MB; allow 30 MB
    # so multipart overhead cannot trip nginx before Multer enforces its limit.
    client_max_body_size 30m;

    # Baseline security headers for API responses (helmet also sets them, but
    # nginx should not depend on the upstream app for browser-facing headers).
    # No CSP here; see the frontend block.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Enable HSTS only after HTTPS is verified end-to-end.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # JSON API responses and model metadata compress well.
    gzip on;
    gzip_proxied any;
    gzip_types application/json model/gltf-binary;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # NestJS/Express trusts this to build correct callback URLs over HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
