# Host Nginx config for the PRIVATE SOAK period (24–48h before public launch).
#
# Drop-in replacement for lor-mentor.conf while you test on the real domain
# WITHOUT the public being able to browse/sign up. The frontend is gated behind
# HTTP Basic Auth; the API is left open because:
#   - it is already JWT-protected (returns 401 without a valid token), and
#   - the Chapa webhook + Let's Encrypt HTTP-01 challenge must be reachable.
#
# Setup:
#   sudo apt install -y apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd preview     # set a password
#   sudo cp deploy/nginx/lor-mentor-staging.conf /etc/nginx/sites-available/lor-mentor
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d lormentor.com -d www.lormentor.com -d api.lormentor.com
#
# When you're ready to GO PUBLIC, remove the auth_basic, auth_basic_user_file,
# and X-Robots-Tag directives from the Certbot-managed installed config. Do not
# overwrite it with the original template or you will remove Certbot's TLS
# blocks. See docs/deployer/10-DEPLOYMENT-GUIDE.md Section 8.
# Replace lormentor.com with your real domain.

# ── Frontend (Next.js) — PRIVATE during soak ────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name lormentor.com www.lormentor.com;

    # Keep it out of search results even if someone finds it.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Password gate for the whole site.
    auth_basic "Lor Mentor — private preview";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Match the API's 25 MB materials cap (plus multipart headroom).
    client_max_body_size 30m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Mirrors lor-mentor.conf: Next.js rewrites /api/v1/* upstream and
        # receipt verification is synchronous, so 60s was too tight.
        proxy_read_timeout 180s;
    }
}

# ── API (NestJS) — OPEN (JWT-protected; webhooks must reach it) ──────
server {
    listen 80;
    listen [::]:80;
    server_name api.lormentor.com;

    # Match the API's 25 MB materials cap (plus multipart headroom).
    client_max_body_size 30m;

    # Baseline security headers, identical to lor-mentor.conf. The soak must
    # exercise the same header behaviour the public launch will serve.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_types application/json model/gltf-binary;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # See lor-mentor.conf: Cheki (20s) + verifier (up to 120s) both run
        # synchronously inside the receipt-submission request.
        proxy_read_timeout 180s;
    }
}
