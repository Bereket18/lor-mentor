# GitLab CI for LOR Mentor.
#
# The `origin` remote is GitLab; `github-old` is GitHub and keeps
# .github/workflows/ci.yml. This file is the port of that workflow plus the
# Docker / nginx / dependency-audit jobs that GitHub Actions never had.
#
# Rules of this file:
#   * Runs on merge requests, the default branch, and manual web pipelines.
#   * No deploy jobs.
#   * No secrets. Every credential below is a throwaway value for the
#     ephemeral CI Postgres service, not a real one.
#   * Hard gates: install, API build, API unit + e2e tests, both anatomy model
#     validators, web lint, web build, verifier tests.
#   * Report-only (allow_failure: true) until they have been proven green on
#     main: npm audit, Docker image builds, compose config, nginx syntax,
#     Trivy. Web lint is a hard gate again now that apps/web lints clean.
#
# Keep the test matrix in sync with .github/workflows/ci.yml.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

stages:
  - test
  - build
  - docker
  - security

default:
  interruptible: true

variables:
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"
  NEXT_TELEMETRY_DISABLED: "1"
  # Throwaway credentials for the ephemeral CI Postgres service. Not secrets:
  # the service lives only for the duration of one job.
  POSTGRES_USER: lor_ci
  POSTGRES_PASSWORD: lor_ci_password
  POSTGRES_DB: lor_mentor_ci
  DATABASE_URL: postgresql://lor_ci:lor_ci_password@postgres:5432/lor_mentor_ci

# ── Shared Node setup ──────────────────────────────────────────────
# `npm ci` is used instead of caching node_modules so every job is
# reproducible from the lockfile. The .npm cache makes it fast.
.node:
  image: node:24
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - node --version
    - npm --version
    - npm ci --cache .npm --prefer-offline

# ── API ────────────────────────────────────────────────────────────
api:build:
  extends: .node
  stage: build
  script:
    - (cd apps/api && npx prisma generate)
    - npm run build:api

api:test:
  extends: .node
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    REDIS_HOST: redis
    REDIS_PORT: "6379"
  script:
    # Prove the committed migrations apply cleanly to a fresh database, then
    # run the unit suite. The suite mocks Prisma/Redis, but the services are
    # here so the migration step is a real end-to-end check of the schema.
    - (cd apps/api && npx prisma generate && npx prisma migrate deploy)
    - (cd apps/api && npx jest --ci)

api:e2e:
  extends: .node
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    REDIS_HOST: redis
    REDIS_PORT: "6379"
  script:
    # Same fresh-database proof as api:test. The e2e spec mocks Prisma and
    # Redis, so this is the only part of the job that touches the real schema.
    - (cd apps/api && npx prisma generate && npx prisma migrate deploy)
    - (cd apps/api && npm run test:e2e)

# Schema validation is cheap and catches a malformed schema before the
# migration/generate steps in the heavier jobs.
prisma:validate:
  extends: .node
  stage: test
  script:
    - npx prisma validate --schema apps/api/prisma/schema.prisma

# Nest's build already type-checks, but this fails fast with a readable list of
# errors and covers test files that tsconfig.build.json excludes.
api:typecheck:
  extends: .node
  stage: test
  script:
    - (cd apps/api && npx prisma generate)
    - npx tsc -p apps/api/tsconfig.json --noEmit

# ── Anatomy model validators ───────────────────────────────────────
anatomy:validators:
  extends: .node
  stage: test
  script:
    - (cd apps/web && node scripts/validate-anatomy-model.mjs --system heart)
    - (cd apps/web && node scripts/validate-anatomy-model.mjs --system urinary)
    - npm run test:scripts

# ── Web ────────────────────────────────────────────────────────────
# Blocking again: apps/web now lints clean. The last five errors were all
# react-hooks/set-state-in-effect — three hydration flags in the auth pages and
# the route-change resets in the topbar and app layout. They were fixed at the
# source (useSyncExternalStore and state adjustment during render) rather than
# suppressed, so this job can gate without an ignore list.
web:lint:
  extends: .node
  stage: test
  script:
    - (cd apps/web && npx eslint .)

web:build:
  extends: .node
  stage: build
  variables:
    NEXT_PUBLIC_API_URL: https://api.example.com
  script:
    - npm run build:web

web:typecheck:
  extends: .node
  stage: test
  variables:
    NEXT_PUBLIC_API_URL: https://api.example.com
  script:
    # Route types live in .next/types and are not committed; generate them
    # without running a full production build.
    - (cd apps/web && npx next typegen)
    - npx tsc -p apps/web/tsconfig.json --noEmit

web:unit:
  extends: .node
  stage: test
  script:
    # Pure TypeScript tests; the config does not launch a browser or dev server.
    - npm run test:unit --workspace=apps/web

# ── Receipt verifier (Python) ──────────────────────────────────────
# normalize.py and its tests are stdlib-only. cbe_links.py needs `requests`.
# The validation/auth helpers live in security.py precisely so test_security.py
# does not import main.py, which pulls `ethiobank_receipts` (Selenium +
# Chromium). Importing main.py here without that package installed is what
# produced `ModuleNotFoundError: No module named 'ethiobank_receipts'`.
# The one test that does import main.py runs it in a subprocess with the heavy
# package stubbed, so the fail-closed startup gate is still covered.
# main.py's real dependency stack is validated by the Docker build below.
verifier:test:
  stage: test
  image: python:3.12-slim
  before_script:
    # fastapi matches services/receipt-verifier/requirements.txt; requests is
    # the version in the venv the suite was validated against. Do not install
    # requirements.txt: it pulls ethiobank-receipts (Selenium + Chromium), which
    # these tests deliberately do not need.
    - pip install requests==2.34.2 fastapi==0.140.0
  script:
    - cd services/receipt-verifier
    - python -m py_compile normalize.py cbe_links.py security.py main.py
    - python test_normalize.py
    - python test_cbe_links.py
    - python test_security.py

# ── Dependency audit (report-only) ─────────────────────────────────
audit:npm:
  extends: .node
  stage: security
  allow_failure: true
  script:
    - |
      status=0
      npm audit --omit=dev --audit-level=high --workspace=apps/api || status=1
      npm audit --omit=dev --audit-level=high --workspace=apps/web || status=1
      exit $status

# ── Docker builds (image only, never pushed) ───────────────────────
# Report-only until the images have built green on main. `docker:dind` gives a
# throwaway daemon; nothing is pushed to a registry.
.docker:
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    - docker info

docker-build-api:
  extends: .docker
  stage: docker
  allow_failure: true
  script:
    - docker build -f apps/api/Dockerfile -t lor-mentor-api:ci .

docker-build-web:
  extends: .docker
  stage: docker
  allow_failure: true
  script:
    - docker build
      --build-arg NEXT_PUBLIC_API_URL=https://api.example.com
      -f apps/web/Dockerfile -t lor-mentor-web:ci .

docker-build-verifier:
  extends: .docker
  stage: docker
  allow_failure: true
  script:
    # Context MUST be the service directory, matching docker-compose.prod.yml
    # (`context: ./services/receipt-verifier`). The Dockerfile's COPY paths are
    # relative to that directory: `COPY requirements.txt .` fails with the repo
    # root as context, and building from the root would also ignore the
    # service's own .dockerignore, shipping test_*.py into the image.
    - docker build -t lor-mentor-verifier:ci ./services/receipt-verifier

# Validate both compose files against a throwaway env. `docker compose config`
# is client-side and does not need a running daemon, but it does need the
# compose plugin, which the CLI image does not bundle.
compose-config:
  stage: docker
  image: docker:27
  allow_failure: true
  before_script:
    - apk add --no-cache docker-cli-compose
  script:
    # Two separate mechanisms are at work here. `--env-file` supplies the values
    # used for ${VAR} interpolation *inside* the compose file. The api service
    # additionally declares a container-level `env_file: .env.production`, which
    # compose resolves as a real path next to the compose file — `--env-file`
    # does NOT satisfy it, which is why the previous /tmp copy failed with
    # "env file .../.env.production not found".
    #
    # So materialise the throwaway env at exactly the path compose expects. The
    # example file holds placeholders only, `.env.*` is in .gitignore so it is
    # never tracked, and .dockerignore excludes `.env.*` so it cannot reach an
    # image layer. Both invocations use it: the staging overlay deliberately
    # inherits api's env_file from the prod file (see its header) and is
    # documented to be run with `--env-file .env.production`.
    - cp .env.production.example .env.production
    - docker compose -f docker-compose.prod.yml --env-file .env.production config > /dev/null
    - docker compose -f docker-compose.prod.yml -f docker-compose.staging.yml --env-file .env.production config > /dev/null

# ── nginx syntax (official image, empty entrypoint) ────────────────
# test-nginx-config.sh copies the conf, substitutes the domain placeholders
# with example.test, mints throwaway self-signed certs, wraps the conf in a
# minimal nginx.conf and runs `nginx -t -c`. Report-only until proven on main.
nginx-syntax:
  stage: docker
  image:
    name: nginx:1.27-alpine
    entrypoint: [""]
  allow_failure: true
  before_script:
    - apk add --no-cache bash openssl
  script:
    - bash deploy/nginx/test-nginx-config.sh

# ── Trivy (report-only) ────────────────────────────────────────────
# Scans the built API image for HIGH/CRITICAL vulnerabilities. --exit-code 0
# keeps it report-only; allow_failure is a second safety net.
trivy:
  stage: security
  image:
    name: aquasec/trivy:0.76.1
    entrypoint: [""]
  allow_failure: true
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    # 0.76.1 is the current GitHub release and a real docker.io tag. The
    # official image is Alpine-based but has no Docker CLI, so add it to build
    # and export the image locally; nothing is pushed to a registry.
    - apk add --no-cache docker-cli
    - docker info
  script:
    - docker build -f apps/api/Dockerfile -t lor-mentor-api:ci .
    - docker save lor-mentor-api:ci -o /tmp/api.tar
    - trivy image --input /tmp/api.tar --severity HIGH,CRITICAL --exit-code 0
