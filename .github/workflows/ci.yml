name: CI

# `origin` is GitLab and keeps .gitlab-ci.yml. This workflow is the port of
# that file and mirrors its hard gates one-for-one:
#
#   install, prisma validate + migrate, API build, API type-check, API unit
#   tests (including the real-Postgres race and gateway-matrix suites), API
#   e2e, anatomy model validators + teaching-text safety tests, web lint, web
#   type-check, web build, web unit tests, verifier tests.
#
# The GitLab account currently has no compute minutes left, so every job there
# fails with `ci_quota_exceeded` before it starts. This workflow is therefore
# the CI of record until that is resolved; keep the two matrices identical.
#
# Report-only in GitLab (npm audit, Docker builds, compose config, nginx
# syntax, Trivy) is not duplicated here.

on:
  push:
    branches:
      - "main"
      - "integration/**"
      - "feature/**"
      - "feat/**"
      - "fix/**"
      - "ci/**"
  pull_request:
    branches: ["main", "integration/**", "feature/**"]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── API + Web (Node monorepo) ─────────────────────────────────────
  node:
    runs-on: ubuntu-latest
    services:
      # Same throwaway credentials as .gitlab-ci.yml. The database lives for
      # one job, so nothing here is a secret.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lor_ci
          POSTGRES_PASSWORD: lor_ci_password
          POSTGRES_DB: lor_mentor_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lor_ci -d lor_mentor_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://lor_ci:lor_ci_password@localhost:5432/lor_mentor_ci
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      NEXT_PUBLIC_API_URL: https://api.example.com
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install (workspaces)
        run: npm ci

      # Schema validation is cheap and catches a malformed schema before the
      # heavier jobs. The committed migrations are then applied to the fresh
      # service database, so a broken migration fails here rather than on a
      # deploy.
      - name: Prisma generate
        working-directory: apps/api
        run: npx prisma generate

      - name: Prisma validate
        run: npx prisma validate --schema apps/api/prisma/schema.prisma

      - name: Prisma migrate deploy
        working-directory: apps/api
        run: npx prisma migrate deploy

      - name: API build
        run: npm run build:api

      # Nest's build already type-checks, but this fails fast with a readable
      # list of errors and covers test files tsconfig.build.json excludes.
      - name: API type-check
        run: npx tsc -p apps/api/tsconfig.json --noEmit

      # CI=true plus DATABASE_URL is what opts the race and gateway-matrix
      # suites in (see payments.race.spec.ts and payments.gateway.matrix.spec.ts).
      - name: API tests
        working-directory: apps/api
        run: npx jest --ci

      - name: API e2e tests
        working-directory: apps/api
        run: npm run test:e2e

      - name: Anatomy model validators
        working-directory: apps/web
        run: |
          node scripts/validate-anatomy-model.mjs --system heart
          node scripts/validate-anatomy-model.mjs --system urinary

      - name: Anatomy teaching-text safety tests
        run: npm run test:scripts

      # Blocking, as in .gitlab-ci.yml: apps/web lints clean at the source.
      - name: Web lint
        working-directory: apps/web
        run: npx eslint .

      # Route types live in .next/types and are not committed; generate them
      # without running a full production build.
      - name: Web type-check
        working-directory: apps/web
        run: |
          npx next typegen
          npx tsc -p tsconfig.json --noEmit

      - name: Web build
        run: npm run build:web

      # Pure TypeScript tests; the config does not launch a browser or dev
      # server, so no Playwright browser download is needed.
      - name: Web unit tests
        run: npm run test:unit --workspace=apps/web

  # ── Receipt-verifier (Python) ─────────────────────────────────────
  verifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/receipt-verifier
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # normalize.py + its tests are stdlib-only. cbe_links.py needs `requests`;
      # the validation/auth helpers live in security.py so the security tests do
      # not import main.py's Selenium/Chromium stack. main.py's real dependency
      # stack is validated by the Docker build in .gitlab-ci.yml.
      - name: Install test dependencies
        run: pip install requests==2.34.2 fastapi==0.140.0

      - name: Byte-compile verifier modules
        run: python -m py_compile normalize.py cbe_links.py security.py main.py

      - name: Normalizer tests
        run: python test_normalize.py

      - name: Receipt-link tests
        run: python test_cbe_links.py

      - name: Security and authentication tests
        run: python test_security.py
