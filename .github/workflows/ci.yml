name: CI

# GitHub mirror of the GitLab pipeline (.gitlab-ci.yml) with only the gates
# that must pass before a branch can be merged. Docker / Trivy / nginx jobs are
# report-only in GitLab, so they are intentionally left out here.
#
# Triggers cover every branch shape used by this repository so feature branches
# get a run without needing a pull request.
on:
  push:
    branches:
      - main
      - "feat/**"
      - "feature/**"
      - "fix/**"
      - "integration/**"
      - "ci/**"
      - "chore/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ── API: schema, build, typecheck, unit + e2e tests ────────────────
  api:
    name: API (build, unit + e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lor_ci
          POSTGRES_PASSWORD: lor_ci_password
          POSTGRES_DB: lor_mentor_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lor_ci -d lor_mentor_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Throwaway credentials for the ephemeral service container, not secrets.
      CI: "true"
      DATABASE_URL: postgresql://lor_ci:lor_ci_password@localhost:5432/lor_mentor_ci
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install (workspaces)
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate --schema apps/api/prisma/schema.prisma

      - name: Prisma generate + migrate
        working-directory: apps/api
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Build API
        run: npm run build:api

      # Nest's build only covers tsconfig.build.json; this also type-checks the
      # test files and anything else the build config excludes.
      - name: Typecheck API
        run: npx tsc -p apps/api/tsconfig.json --noEmit

      - name: API unit tests
        working-directory: apps/api
        run: npx jest --ci

      - name: API e2e tests
        working-directory: apps/api
        run: npm run test:e2e

  # ── Web: lint, typecheck, unit tests, production build ────────────
  web:
    name: Web (lint, typecheck, unit, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_API_URL: https://api.example.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install (workspaces)
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npx eslint .

      # Route types live in .next/types and are not committed; generate them
      # without running a full production build.
      - name: Generate route types
        working-directory: apps/web
        run: npx next typegen

      - name: Typecheck
        working-directory: apps/web
        run: npx tsc -p tsconfig.json --noEmit

      - name: Unit tests
        run: npm run test:unit --workspace=apps/web

      - name: Build web
        run: npm run build:web

  # ── Anatomy model validators ──────────────────────────────────────
  anatomy:
    name: Anatomy validators
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate heart model
        working-directory: apps/web
        run: node scripts/validate-anatomy-model.mjs --system heart

      - name: Validate urinary model
        working-directory: apps/web
        run: node scripts/validate-anatomy-model.mjs --system urinary

      - name: Teaching-text safety tests
        run: npm run test:scripts

  # ── Receipt verifier (Python, stdlib + fastapi) ───────────────────
  verifier:
    name: Receipt verifier tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        # Do not install requirements.txt: it pulls ethiobank-receipts
        # (Selenium + Chromium), which these tests deliberately do not need.
        run: python -m pip install --disable-pip-version-check requests==2.34.2 fastapi==0.140.0

      - name: Run verifier tests
        working-directory: services/receipt-verifier
        run: |
          python -m py_compile normalize.py cbe_links.py security.py main.py
          python test_normalize.py
          python test_cbe_links.py
          python test_security.py
