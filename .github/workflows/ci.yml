naming: Lor Mentor CI/CD

on:
  push:
  pull_request:

jobs:
  # ── API Jobs ────────────────────────────────────────────────────────
  api-build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lor_ci
          POSTGRES_PASSWORD: lor_ci_password
          POSTGRES_DB: lor_mentor_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://lor_ci:lor_ci_password@localhost:5432/lor_mentor_ci
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_AUDIT: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      
      # Prisma generate & build
      - name: API Build & Migrate
        run: |
          cd apps/api
          npx prisma generate
          npx prisma migrate deploy
          npm run build

      # API Unit & E2E Tests
      - name: Run API Tests
        run: |
          cd apps/api
          npx jest --ci
          npm run test:e2e

  prisma-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma validate --schema apps/api/prisma/schema.prisma

  api-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: |
          cd apps/api
          npx prisma generate
      - run: npx tsc -p apps/api/tsconfig.json --noEmit

  # ── Anatomy Model Validators ────────────────────────────────────────
  anatomy-validators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: |
          cd apps/web
          node scripts/validate-anatomy-model.mjs --system heart
          node scripts/validate-anatomy-model.mjs --system urinary
      - run: npm run test:scripts

  # ── Web Jobs ────────────────────────────────────────────────────────
  web-ci:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: https://api.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      
      - name: Web Lint
        run: cd apps/web && npx eslint .

      - name: Web Build & Typegen
        run: |
          cd apps/web
          npx next typegen
          npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com

      - name: Web Unit Tests
        run: npm run test:unit --workspace=apps/web

  # ── Verifier Tests (Python) ─────────────────────────────────────────
  verifier-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python Dependencies
        run: pip install requests==2.34.2 fastapi==0.140.0
      - name: Run Verifier Tests
        run: |
          cd services/receipt-verifier
          python -m py_compile normalize.py cbe_links.py security.py main.py
          python test_normalize.py
          python test_cbe_links.py
          python test_security.py

  # ── Docker Builds ───────────────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
         uses: docker/setup-buildx-action@v3
      
      - name: Build API Docker Image
        run: docker build -f apps/api/Dockerfile -t lor-mentor-api:ci .

      - name: Build Web Docker Image
        run: |
          docker build \
             --build-arg NEXT_PUBLIC_API_URL=https://api.example.com \
             -f apps/web/Dockerfile -t lor-mentor-web:ci .

      - name: Build Verifier Docker Image
        run: docker build -t lor-mentor-verifier:ci ./services/receipt-verifier

  # ── Security Scan (Trivy) ───────────────────────────────────────────
  trivy-scan:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - name: Build API Image for Scan
        run: docker build -f apps/api/Dockerfile -t lor-mentor-api:ci .
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'lor-mentor-api:ci'
          format: 'table'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'
