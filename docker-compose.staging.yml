# Staging OVERLAY for the private soak. Layer it on top of the prod compose:
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.staging.yml \
#     --env-file .env.production up -d --build
#
# The private-access gate is at Nginx (deploy/nginx/lor-mentor-staging.conf).
#
# This overlay intentionally adds as little as possible. Resource limits, log
# rotation, secret scoping and the non-root/hardening settings all live in
# docker-compose.prod.yml now, so staging exercises the SAME container
# configuration that production will run — a staging-only limit would hide a
# production problem rather than catch it. All this file adds is a label so you
# can tell soak containers apart.
#
# NODE_ENV stays "production" — never weaken security settings during the soak;
# the whole point is to test the real thing.

services:
  postgres:
    labels: { com.lormentor.env: staging }

  redis:
    labels: { com.lormentor.env: staging }

  verifier:
    labels: { com.lormentor.env: staging }

  api:
    labels: { com.lormentor.env: staging }

  web:
    labels: { com.lormentor.env: staging }
